# Deploy Flutter web to GitHub Pages on pushes to main.
# Site: https://kamal01236.github.io/asset-os/
#
# Prerequisites (both required or deploy-pages returns 404):
# 1. GitHub Pages must be available for this repo:
#    - Public repos: available on Free plan
#    - Private repos: GitHub Pro (or Team/Enterprise) required
# 2. Settings → Pages → Build and deployment → Source = GitHub Actions
#    https://github.com/kamal01236/asset-os/settings/pages
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        working-directory: apps/web
        run: |
          set -euo pipefail
          flutter pub get
          flutter build web --release --base-href /asset-os/
          cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
