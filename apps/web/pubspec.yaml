name: asset_os
description: Hando — privacy-first offline asset handover client (web + Android).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  file_picker: ^8.1.7
  flutter_riverpod: ^2.6.1
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  sqlite3: ^2.7.0
  url_launcher: ^6.3.1
  web: ^1.1.1
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.4
  local_auth: ^2.3.0
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  generate: true
