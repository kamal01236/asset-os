server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Drift SQLite wasm must be served as application/wasm.
  location ~* \.wasm$ {
    default_type application/wasm;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Flutter web assets (hashed) can be cached aggressively
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /canvaskit/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: serve index.html for client-side routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
